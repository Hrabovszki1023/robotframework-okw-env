[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-okw-env"
version = "0.1.0"
description = "Driver-agnostic environment abstraction for OKW4Robot. Defines keywords and YAML-based component definitions to build, run, and tear down ephemeral test environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "robotframework>=6.0",
  "pyyaml>=6.0"
]

[project.urls]
Repository = "http://192.168.1.130:3000/Hrabovszki1023/robotframework-okw-env"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
